        .exterior-home { display: inline-block; margin-bottom: 12px; color: inherit; text-decoration: underline; text-underline-offset: 4px; }
        .exterior-page #estimate-dialog { width: min(390px, calc(100vw - 32px)); padding: 24px; }

        .offer-form { display: grid; gap: 14px; }
        .offer-form label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
        .offer-form input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #c6c2bd; border-radius: 9px; font-size: 16px; font-weight: 400; }
        .offer-form input:focus { outline: 2px solid #c75623; outline-offset: 1px; }
        .offer-form .submit-btn { margin: 2px 0 0; font-size: 16px; }
        #offer-status { font-size: 14px; line-height: 1.4; }
        .exterior-page .visualization { position: relative; }
        #photo-loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: rgb(0 0 0 / 42%); border-radius: inherit; }
        #photo-loading[hidden] { display: none; }
        #photo-loading span { padding: 9px 16px; border-radius: 20px; background: #292929; color: #fff; }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Ссылка назад в хаб -->
        <a class="exterior-home" href="exterior-hub.html">← Назад к выбору объекта</a>
        <h1 class="hero-title">Барнхаус: <span>конструктор</span></h1>
        <p class="hero-subtitle">Выберите цвета кровли и фасада для вашего дома.</p>
    </section>

    <div class="main-container">
        <div class="layout">
            
            <!-- Левая часть: Большое фото -->
            <div class="visualization">
                <div id="photo-loading" role="status" hidden><span>Загрузка фото…</span></div>
                <!-- Начальное фото: 1.webp (Серый/Белый) -->
                <img id="house" src="assets/new-webp2/1.webp" width="2048" height="1143" alt="Дом в стиле Барнхаус с серой кровлей и белым фасадом" fetchpriority="high" decoding="async">
            </div>

            <!-- Правая часть: Панель -->
            <form class="controls finish-panel" aria-labelledby="finish-title">
                <h2 id="finish-title">Отделка дома</h2>
                <button type="button" class="design-variants-btn" id="design-variants" aria-controls="house">Дизайн-варианты <span aria-hidden="true">→</span></button>
                
                <!-- Только Кровля и Фасад (Водосток убран) -->
                <fieldset class="finish-group finish-roof">
                    <legend>Цвет кровли</legend>
                    <div class="finish-options">
                        <label class="finish-option"><input type="radio" name="roof" value="gray" data-label="Серый" checked><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #99938c"></span><span>Серый</span></span></label>
                        <label class="finish-option"><input type="radio" name="roof" value="graphite" data-label="Графит"><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #454956"></span><span>Графит</span></span></label>
                        <label class="finish-option"><input type="radio" name="roof" value="brown" data-label="Шоколад"><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #5c4033"></span><span>Шоколад</span></span></label>
                        <label class="finish-option"><input type="radio" name="roof" value="terra" data-label="Терракота"><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #9e4b47"></span><span>Терракота</span></span></label>
                    </div>
                </fieldset>
                
                <fieldset class="finish-group finish-facade">
                    <legend>Цвет фасада</legend>
                    <div class="finish-options">
                        <label class="finish-option"><input type="radio" name="facade" value="gray" data-label="Серый"><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #b0b5b9"></span><span>Серый</span></span></label>
                        <label class="finish-option"><input type="radio" name="facade" value="sand" data-label="Песочный"><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #d9c5a0"></span><span>Песочный</span></span></label>
                        <label class="finish-option"><input type="radio" name="facade" value="white" data-label="Молочный" checked><span class="finish-tile"><span class="finish-swatch" style="--finish-color: #f4ede1"></span><span>Молочный</span></span></label>
                    </div>
                </fieldset>
                
                <p class="finish-note" id="preview-status" role="status" hidden></p>
                <button type="submit" class="submit-btn" id="open-estimate">Получить предложение</button>
            </form>
        </div>
    </div>

<dialog id="estimate-dialog" aria-labelledby="estimate-title">
    <h2 id="estimate-title">Получить предложение</h2>
    <form id="offer-form" class="offer-form">
        <label>Телефон <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+375 (29) 123-45-67" pattern="\+375 \([0-9]{2}\) [0-9]{3}-[0-9]{2}-[0-9]{2}" required></label>
        <label>Электронная почта <input name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required></label>
        <button class="submit-btn" type="submit">Отправить заявку</button>
    </form>
    <p id="offer-status" role="status" hidden></p>
</dialog>

<script>
    const panel = document.querySelector('.finish-panel');
    const photo = document.getElementById('house');
    const previewStatus = document.getElementById('preview-status');
    const estimate = document.getElementById('estimate-dialog');
    const groupNames = ['roof', 'facade']; // Только кровля и фасад (нет водостока)
    
    const original = { src: photo.getAttribute('src'), alt: 'Дом в стиле Барнхаус с серой кровлей и белым фасадом' };
    
    // Таблица соответствует порядку из промтов для Барнхауса
    const photos = {
        'gray/white':   { src: 'assets/new-webp2/1.webp', alt: 'Серая кровля, белый фасад' },
        'graphite/white': { src: 'assets/new-webp2/2.webp', alt: 'Графитовая кровля, белый фасад' },
        'brown/white':  { src: 'assets/new-webp2/3.webp', alt: 'Шоколадная кровля, белый фасад' },
        'terra/white':  { src: 'assets/new-webp2/4.webp', alt: 'Терракотовая кровля, белый фасад' },
        
        'gray/sand':    { src: 'assets/new-webp2/5.webp', alt: 'Серая кровля, песочный фасад' },
        'graphite/sand':{ src: 'assets/new-webp2/6.webp', alt: 'Графитовая кровля, песочный фасад' },
        'brown/sand':   { src: 'assets/new-webp2/7.webp', alt: 'Шоколадная кровля, песочный фасад' },
        'terra/sand':   { src: 'assets/new-webp2/8.webp', alt: 'Терракотовая кровля, песочный фасад' },
        
        'gray/gray':    { src: 'assets/new-webp2/9.webp', alt: 'Серая кровля, серый фасад' },
        'graphite/gray':{ src: 'assets/new-webp2/10.webp', alt: 'Графитовая кровля, серый фасад' },
        'brown/gray':   { src: 'assets/new-webp2/11.webp', alt: 'Шоколадная кровля, серый фасад' },
        'terra/gray':   { src: 'assets/new-webp2/12.webp', alt: 'Терракотовая кровля, серый фасад' }
    };

    function selectedColors() {
        return groupNames.map(name => panel.querySelector('input[name="' + name + '"]:checked'));
    }

    const designButton = document.getElementById('design-variants');
    const loadingStatus = document.getElementById('photo-loading');
    const openEstimate = document.getElementById('open-estimate');
    let lastDesignNumber = 0;
    let designActive = false;
    let previewRequest = 0;
    let previewLoading = false;
    let displayedSelection = { image: original.src, variant: 'gray/white' };

    function setPreviewLoading(loading) {
        previewLoading = loading;
        loadingStatus.hidden = !loading;
        openEstimate.disabled = loading;
    }

    async function loadPhoto(src) {
        const image = new Image();
        image.src = src;
        try {
            await image.decode();
            return true;
        } catch {
            return false;
        }
    }

    function showPhoto(src, alt, variant) {
        photo.setAttribute('src', src);
        photo.alt = alt;
        displayedSelection = { image: src, variant };
    }

    async function updatePreview() {
        designActive = false;
        const request = ++previewRequest;
        const inputs = selectedColors();
        const key = inputs.map(input => input.value).join('/');
        const match = photos[key];
        const preview = match || original;
        setPreviewLoading(true);
        const loaded = await loadPhoto(preview.src);
        if (request !== previewRequest) return;
        setPreviewLoading(false);

        if (loaded) showPhoto(preview.src, preview.alt, key);
        previewStatus.hidden = loaded && Boolean(match);
        previewStatus.textContent = loaded ? 'Фото для этого сочетания пока нет. Показан исходный вариант.' : 'Не удалось загрузить фото.';
    }

    designButton.addEventListener('click', async () => {
        if (previewLoading && designActive) return;
        const request = ++previewRequest;
        let number = designActive ? lastDesignNumber + 1 : 1;
        designActive = true;
        setPreviewLoading(true);
        let loaded = false;
        let src = '';
        let attempts = 0;
        const maxNumber = 100;

        while (attempts < maxNumber) {
            if (number > maxNumber) number = 1;
            // Дизайн-варианты для барнхауса ищем в новой папке
            src = 'assets/new-webp2/design/' + number + '.webp';
            loaded = await loadPhoto(src);
            if (loaded && request === previewRequest) break;
            number++;
            attempts++;
        }

        if (request !== previewRequest) return;
        setPreviewLoading(false);
        if (!loaded) {
            designActive = false;
            previewStatus.hidden = false;
            previewStatus.textContent = 'Нет доступных дизайн-вариантов.';
            return;
        }
        lastDesignNumber = number;
        showPhoto(src, 'Дизайн-вариант ' + number, 'design/' + number);
        previewStatus.hidden = true;
    });

    panel.addEventListener('change', updatePreview);
    const offerForm = document.getElementById('offer-form');
    const offerSubmit = offerForm.querySelector('button[type="submit"]');
    const offerStatus = document.getElementById('offer-status');
    const phone = offerForm.elements.phone;
    let offerSelection;
    let offerSending = false;

    phone.addEventListener('input', () => {
        let digits = phone.value.replace(/\D/g, '');
        if (digits.startsWith('375')) digits = digits.slice(3);
        else if (digits.length >= 11 && digits.startsWith('80')) digits = digits.slice(2);
        digits = digits.slice(0, 9);
        if (!digits) { phone.value = ''; return; }
        let formatted = '+375 (' + digits.slice(0, 2);
        if (digits.length > 2) formatted += ') ' + digits.slice(2, 5);
        if (digits.length > 5) formatted += '-' + digits.slice(5, 7);
        if (digits.length > 7) formatted += '-' + digits.slice(7, 9);
        phone.value = formatted;
    });

    function outsideOffer(event) {
        if (event.target !== estimate) return false;
        const bounds = estimate.getBoundingClientRect();
        return event.clientX < bounds.left || event.clientX >= bounds.right || event.clientY < bounds.top || event.clientY >= bounds.bottom;
    }
    let pressedOutside = false;
    estimate.addEventListener('pointerdown', event => { pressedOutside = outsideOffer(event); });
    estimate.addEventListener('click', event => {
        if (pressedOutside && outsideOffer(event)) estimate.close();
        pressedOutside = false;
    });

    panel.addEventListener('submit', event => {
        event.preventDefault();
        if (previewLoading) return;
        offerSelection = displayedSelection;
        if (!offerSending) { offerStatus.hidden = true; offerSubmit.disabled = false; }
        estimate.showModal();
    });

    offerForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (offerSending) return;
        const details = Object.fromEntries(new FormData(offerForm));
        offerSending = true;
        offerSubmit.disabled = true;
        offerStatus.hidden = false;
        offerStatus.textContent = 'Отправляем письмо…';
        try {
            const response = await fetch('https://house-2oga.onrender.com/api/exterior-offer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({...offerSelection, ...details})
            });
            const result = await response.json();
            if (!response.ok || result.ok !== true) throw new Error(result.error);
            offerForm.reset();
            offerStatus.textContent = 'Письмо с выбранным фото отправлено.';
        } catch (error) {
            offerStatus.textContent = error.message === 'rate_limit' ? 'Слишком много заявок.' : 'Не удалось отправить заявку.';
        } finally {
            offerSubmit.disabled = false;
            offerSending = false;
        }
    });

    updatePreview();
</script>
</body>
